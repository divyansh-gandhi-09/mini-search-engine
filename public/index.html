<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mini Search Engine</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <!-- Main Heading -->
    <h1 class="main-heading">Mini Search Engine 🔎</h1>

    <!-- Search Form -->
    <form id="search-form">
      <input id="search-box" type="text" placeholder="Type your query..." autocomplete="off" />
      <button type="submit">Search</button>
    </form>

    <!-- Suggestions & Corrections -->
    <div id="suggestions" class="pill-row"></div>
    <div id="corrections" class="pill-row"></div>

    <!-- Results Section -->
    <h2 class="section-heading">📄 Search Results</h2>
    <div id="results"></div>

    <!-- Upload Section -->
    <h2 class="section-heading">📤 Upload New Document</h2>
    <form id="upload-form" class="action-form">
      <input id="upload-filename" type="text" placeholder="Filename (e.g. notes.txt)" required />
      <textarea id="upload-content" placeholder="Document content..." required></textarea>
      <button type="submit">Upload</button>
    </form>

    <!-- Edit Section -->
    <h2 class="section-heading">✏️ Edit Existing Document</h2>
    <form id="edit-form" class="action-form">
      <input id="edit-id" type="number" placeholder="Document ID" required />
      <textarea id="edit-content" placeholder="New content..." required></textarea>
      <button type="submit">Save Changes</button>
    </form>
  </main>

  <script src="app.js"></script>
</body>
</html>
